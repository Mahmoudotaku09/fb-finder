name: FB Phone Brute
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: تثبيت بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: تثبيت المتطلبات
        run: pip install requests
      - name: جلب البروكسيات
        run: python get_proxies.py
      - name: تشغيل البحث
        run: python fb_phone_brute.py
      - name: رفع النتيجة
        uses: actions/upload-artifact@v4
        with:
          name: found_phone
          path: found.txt
